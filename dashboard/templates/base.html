<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradeFlow Dashboard</title>
  <!-- Q4: vendored to /static (was cdn.jsdelivr.net / unpkg.com) so a loopback-only
       dashboard has no runtime external-CDN dependency. -->
  <link href="/static/bootstrap.min.css" rel="stylesheet">
  <link href="/static/dashboard.css" rel="stylesheet">
  <script src="/static/htmx.min.js"></script>
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-3">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">TradeFlow</span>
      <div class="navbar-nav flex-row gap-3">
        <a class="nav-link" href="/">Live</a>
        <a class="nav-link" href="/trades">Trades</a>
        <a class="nav-link" href="/pnl">Daily P&amp;L</a>
        <a class="nav-link" href="/scoreboard">Scoreboard</a>
        <a class="nav-link" href="/divergence">Divergence</a>
      </div>
    </div>
  </nav>
  <main class="container-fluid">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
