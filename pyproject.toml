[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeflow"
version = "0.1.0"
description = "Autonomous MNQ futures trading bot on Interactive Brokers."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "TradeFlow" }]
dependencies = [
    "ib-async>=1.0.3,<2.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "ta>=0.11,<0.12",
    "python-dotenv>=1.0,<2.0",
    "structlog>=24.1,<26.0",
    "httpx>=0.27,<0.29",
    "python-telegram-bot>=21.0,<22.0",
    "tenacity>=8.2,<10.0",
    "pytz>=2024.1",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "jinja2==3.1.4",
    "telethon>=1.34,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0",
    "black>=24.0,<26.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
]

[project.scripts]
tradeflow = "main:main"

[tool.setuptools.packages.find]
include = ["config*", "comms*", "data*", "strategy*", "features*", "execution*", "risk*", "backtest*", "scripts*", "src*"]
exclude = ["tests*", "docs*", "supabase*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
