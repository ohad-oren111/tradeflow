# TradeFlow Phase 1 — IB Gateway paper-mode container.
#
# Image: gnzsnz/ib-gateway (community, env-driven config, runs IBC under the hood).
# Pinned to ":stable" channel — IB Gateway 10.45.1f / IBC 3.23.0 as of 2026-05-20.
# Bump intentionally. Do NOT use ":latest" — it tracks the IB Gateway latest channel
# which can ship breaking changes from IBKR mid-week.
#
# Loopback bind on 127.0.0.1:4002 — the gateway must not be reachable from outside
# the VPS. Future orchestrator containers connect through the docker network at
# host `ib-gateway:4002`, not via the published port.
#
# Internal port mapping per the gnzsnz README:
#   container 4004 (paper via socat) -> host 4002
#   container 4003 (live   via socat) -> host 4001  (not exposed in paper-only PR 2)

services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: tradeflow-ib-gateway
    restart: unless-stopped
    env_file:
      - ${TRADEFLOW_SECRETS_DIR:-/home/tradeflow/.tradeflow-secrets}/.env
    environment:
      # Map TradeFlow IBKR_* secrets to the gnzsnz image's canonical TWS_* names.
      TWS_USERID: ${IBKR_USERNAME}
      TWS_PASSWORD: ${IBKR_PASSWORD}
      TRADING_MODE: paper
      TWOFA_TIMEOUT_ACTION: ${TWOFA_TIMEOUT_ACTION:-exit}
      RELOGIN_AFTER_TWOFA_TIMEOUT: ${RELOGIN_AFTER_TWOFA_TIMEOUT:-yes}
      AUTO_RESTART_TIME: ${AUTO_RESTART_TIME:-11:59 PM}
      TIME_ZONE: ${TIME_ZONE:-Etc/UTC}
      READ_ONLY_API: ${READ_ONLY_API:-no}
      BYPASS_WARNING: ${BYPASS_WARNING:-yes}
      EXISTING_SESSION_DETECTED_ACTION: primary
    ports:
      - "127.0.0.1:4002:4004"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/4004' || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    networks:
      - tradeflow-net

  tradeflow-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradeflow-app
    restart: unless-stopped
    env_file:
      - ${TRADEFLOW_SECRETS_DIR:-/home/tradeflow/.tradeflow-secrets}/.env
    environment:
      # Container-routing constants — must NOT be interpolated from .env. The
      # host-side .env carries IBKR_HOST=127.0.0.1 / IBKR_PORT=4002 for HOST
      # scripts (probes, smoke tests run on the VPS itself); inside the docker
      # network the orchestrator must dial the service name `ib-gateway` on the
      # container-internal port 4004 (the host-mapped 4002 is not visible here).
      # `${IBKR_HOST:-ib-gateway}` was a trap — the `:-default` never fires
      # because the variable IS set in .env, just to the host-side value.
      IBKR_HOST: ib-gateway
      IBKR_PORT: "4004"
      ORCH_HEALTHCHECK_INTERVAL_SEC: ${ORCH_HEALTHCHECK_INTERVAL_SEC:-60}
      ORCH_LOG_LEVEL: ${ORCH_LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
    depends_on:
      - ib-gateway
    networks:
      - tradeflow-net

networks:
  tradeflow-net:
    driver: bridge
